<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SpotFetch — Download músicas e playlists do Spotify de forma rápida e fácil.">
  <title>SpotFetch — Spotify Downloader</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎵%3C/text%3E%3C/svg%3E">
</head>
<body>

  <div class="app-container">

    <!-- ─── Header ────────────────────────────────────────────── -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
        <span class="logo-text">SpotFetch</span>
      </div>
      <p class="header-subtitle">Baixe músicas, playlists e álbuns do Spotify</p>
    </header>

    <!-- ─── Search Bar ────────────────────────────────────────── -->
    <section class="search-section" id="search-section">
      <div class="search-box" id="search-box">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </span>
        <input 
          type="text" 
          class="search-input" 
          id="url-input"
          placeholder="Cole a URL do Spotify aqui (track, playlist, album...)"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="search-btn" id="download-btn" onclick="handleDownload()">
          <span class="btn-text">Download</span>
          <span class="btn-spinner"></span>
        </button>
      </div>
      <div style="text-align: center;">
        <span class="url-type-badge" id="url-type-badge"></span>
      </div>
    </section>

    <!-- ─── Ad Banner Top ─────────────────────────────────────── -->
    <div class="ad-banner" id="ad-banner-top">
      <!-- Insira aqui o código do seu banner (Google AdSense, PropellerAds, etc.) -->
      <div class="ad-placeholder">Anúncio</div>
    </div>

    <!-- ─── Downloads Queue ───────────────────────────────────── -->
    <section class="queue-section">
      <div class="queue-header">
        <h2 class="queue-title">Downloads</h2>
        <span class="queue-badge" id="queue-badge"></span>
      </div>
      <div class="download-list" id="download-list">
        <div class="empty-state" id="queue-empty">
          <div class="empty-state-icon">📥</div>
          <div class="empty-state-title">Nenhum download ativo</div>
          <div class="empty-state-text">Cole uma URL do Spotify acima para começar a baixar músicas</div>
        </div>
      </div>
    </section>

    <!-- ─── Ad Banner Bottom ──────────────────────────────────── -->
    <div class="ad-banner" id="ad-banner-bottom">
      <!-- Insira aqui o código do seu banner (Google AdSense, PropellerAds, etc.) -->
      <div class="ad-placeholder">Anúncio</div>
    </div>

  </div>

  <!-- ─── Toasts ──────────────────────────────────────────────── -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
