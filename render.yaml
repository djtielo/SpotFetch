services:
  - type: web
    name: spotfetch
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 300 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      name: downloads
      mountPath: /app/downloads
      sizeGB: 1
